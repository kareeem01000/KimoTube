<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - KimoTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f8f9fc; color: #1a1a2e; padding: 24px;
    }
    .container { text-align: center; max-width: 400px; }
    .icon { width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, #FF3B5C, #FFA726); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .icon svg { width: 40px; height: 40px; fill: #fff; }
    h1 { font-size: 1.75rem; margin-bottom: 12px; }
    p { color: #4a4a6a; line-height: 1.7; margin-bottom: 24px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 12px;
      background: linear-gradient(135deg, #FF3B5C, #FF6B3D);
      color: #fff; text-decoration: none; font-weight: 600;
      box-shadow: 0 4px 16px rgba(255,59,92,0.3);
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><svg viewBox="0 0 44 44"><path d="M22 8l18 14-18 14V8z"/></svg></div>
    <h1>You're Offline</h1>
    <p>KimoTube needs an internet connection to download videos. Please check your connection and try again.</p>
    <a href="/" class="btn">Try Again</a>
  </div>
</body>
</html>
